<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" fill="none">
  <!--
    PLACEHOLDER — substitua salvando sua logo em /public/logo.png
    e trocando LOGO_FULL_SRC em components/Logo.tsx para "/logo.png".
    Este SVG é só pra não quebrar o build enquanto a PNG real não está no projeto.
  -->
  <defs>
    <linearGradient id="lp-wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="lp-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="lp-shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1D2E"/>
      <stop offset="100%" stop-color="#0A0C18"/>
    </linearGradient>
  </defs>

  <!-- Escudo -->
  <g transform="translate(8 12)">
    <path d="M36 0 L70 10 V40 C70 58 55 70 36 72 C17 70 2 58 2 40 V10 Z"
          fill="url(#lp-shieldFill)" stroke="url(#lp-shield)" stroke-width="2.5"/>
    <!-- Barras gráfico -->
    <rect x="14" y="44" width="6" height="14" rx="1.5" fill="#22C55E"/>
    <rect x="24" y="36" width="6" height="22" rx="1.5" fill="#22C55E"/>
    <rect x="34" y="28" width="6" height="30" rx="1.5" fill="#22C55E"/>
    <rect x="44" y="20" width="6" height="38" rx="1.5" fill="#22C55E"/>
    <!-- Bola -->
    <circle cx="48" cy="20" r="8" fill="#FF7A1A" stroke="#0A0C18" stroke-width="1"/>
    <path d="M40 20 H56 M48 12 V28 M42 14 Q48 20 54 26 M54 14 Q48 20 42 26" stroke="#0A0C18" stroke-width="1" fill="none"/>
    <!-- Setinha de crescimento -->
    <path d="M14 56 L34 36 L46 42 L62 22" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M58 18 L66 22 L62 30 Z" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark "ClutchPro" -->
  <text x="98" y="62" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="44" letter-spacing="-1" fill="url(#lp-wm)">ClutchPro</text>
</svg>
